<!-- 💗 PARUL'S BIRTHDAY COUNTDOWN -->
<section class="birthday-countdown">
  <div class="countdown-glow"></div>

  <p class="countdown-small">✨ Something beautiful is almost here ✨</p>

  <h2>
    Counting down to
    <span>Parul's 22nd Birthday</span> 🎂❤️
  </h2>

  <p class="countdown-message">
    Bas thoda sa aur wait... 🥹<br>
    because the most beautiful day is almost here.
  </p>

  <div class="countdown-boxes">
    <div class="time-box">
      <span id="days">00</span>
      <small>Days</small>
    </div>

    <div class="colon">:</div>

    <div class="time-box">
      <span id="hours">00</span>
      <small>Hours</small>
    </div>

    <div class="colon">:</div>

    <div class="time-box">
      <span id="minutes">00</span>
      <small>Minutes</small>
    </div>

    <div class="colon">:</div>

    <div class="time-box">
      <span id="seconds">00</span>
      <small>Seconds</small>
    </div>
  </div>

  <div id="birthday-message" class="birthday-message">
    ❤️ Happy Birthday, Parul ❤️
  </div>
</section>


<style>
  .birthday-countdown {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 80px 20px;
    min-height: 500px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
      radial-gradient(circle at 50% 20%, #ffd6e7 0%, transparent 35%),
      linear-gradient(135deg, #fff5f8, #ffe7ef, #fff);
    font-family: "Poppins", sans-serif;
    color: #5a2639;
  }

  .countdown-glow {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: rgba(255, 105, 150, 0.18);
    filter: blur(70px);
    animation: glow 4s ease-in-out infinite alternate;
  }

  .countdown-small {
    position: relative;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #c65b80;
    margin-bottom: 15px;
  }

  .birthday-countdown h2 {
    position: relative;
    max-width: 700px;
    margin: 0;
    font-family: "Playfair Display", serif;
    font-size: clamp(35px, 6vw, 65px);
    line-height: 1.15;
  }

  .birthday-countdown h2 span {
    display: block;
    color: #e75480;
    font-style: italic;
  }

  .countdown-message {
    position: relative;
    margin: 20px 0 35px;
    font-size: 16px;
    line-height: 1.7;
    color: #7b4a5b;
  }

  .countdown-boxes {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .time-box {
    width: 110px;
    height: 115px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    border-radius: 25px;

    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(15px);

    border: 1px solid rgba(231, 84, 128, 0.18);

    box-shadow:
      0 15px 40px rgba(160, 60, 100, 0.12),
      inset 0 0 20px rgba(255,255,255,0.6);

    transition: 0.3s ease;
  }

  .time-box:hover {
    transform: translateY(-8px) scale(1.04);
    box-shadow: 0 20px 45px rgba(231, 84, 128, 0.25);
  }

  .time-box span {
    font-size: 38px;
    font-weight: 700;
    color: #e75480;
    line-height: 1;
  }

  .time-box small {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8d596b;
  }

  .colon {
    font-size: 35px;
    font-weight: bold;
    color: #e75480;
    animation: blink 1s infinite;
  }

  .birthday-message {
    display: none;
    position: relative;
    margin-top: 35px;
    font-family: "Playfair Display", serif;
    font-size: clamp(30px, 5vw, 55px);
    color: #e75480;
    animation: birthdayPop 1s ease forwards;
  }

  @keyframes blink {
    50% {
      opacity: 0.25;
    }
  }

  @keyframes glow {
    from {
      transform: scale(0.9);
      opacity: 0.5;
    }

    to {
      transform: scale(1.15);
      opacity: 0.9;
    }
  }

  @keyframes birthdayPop {
    0% {
      transform: scale(0.5);
      opacity: 0;
    }

    70% {
      transform: scale(1.1);
    }

    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  @media (max-width: 600px) {
    .birthday-countdown {
      padding: 60px 15px;
    }

    .time-box {
      width: 75px;
      height: 85px;
      border-radius: 18px;
    }

    .time-box span {
      font-size: 28px;
    }

    .colon {
      font-size: 25px;
    }

    .countdown-boxes {
      gap: 5px;
    }
  }
</style>


<script>
  // 🎂 Parul's Birthday
  // 15 September 2026, 12:00 AM IST

  const birthday = new Date("2026-09-15T00:00:00+05:30").getTime();

  const timer = setInterval(function () {

    const now = new Date().getTime();
    const distance = birthday - now;

    if (distance <= 0) {
      clearInterval(timer);

      document.getElementById("days").textContent = "00";
      document.getElementById("hours").textContent = "00";
      document.getElementById("minutes").textContent = "00";
      document.getElementById("seconds").textContent = "00";

      document.getElementById("birthday-message").style.display = "block";

      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor(
      (distance / (1000 * 60 * 60)) % 24
    );
    const minutes = Math.floor(
      (distance / (1000 * 60)) % 60
    );
    const seconds = Math.floor(
      (distance / 1000) % 60
    );

    document.getElementById("days").textContent =
      String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
      String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
      String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
      String(seconds).padStart(2, "0");

  }, 1000);
</script>
